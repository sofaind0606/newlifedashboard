<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LifeDashboard | План на день</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --color-primary: #93ABDB;
            --color-primary-dark: #768FC2;
            --color-primary-light: #C2D4F5;
            --color-secondary: #FAF4CD;
            --color-secondary-dark: #E6DFB3;
            --color-secondary-light: #FFF9E6;
            --color-accent: #5B6F9E;
            --color-text: #3D4A66;
            --color-text-light: #6B7C9E;
            --color-text-muted: #A5B3CC;
            --color-bg: #FDFBF0;
            --color-bg-alt: #FFFFFF;
            --color-border: #FAF4CD;
            --color-error: #E15554;
            --color-success: #6BCB77;
            --color-warning: #FFD93D;
            --shadow-sm: 0 2px 8px rgba(91, 111, 158, 0.05);
            --shadow-md: 0 4px 15px rgba(91, 111, 158, 0.08);
            --shadow-lg: 0 10px 30px rgba(91, 111, 158, 0.12);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body { font-family: 'Inter', sans-serif; background: var(--color-bg); color: var(--color-text); line-height: 1.5; }

        /* ---------- НАВИГАЦИЯ ---------- */
        .app-layout { display: flex; min-height: 100vh; position: relative; overflow-x: hidden; }
        .burger-btn { display: none; position: fixed; top: 16px; left: 16px; z-index: 1001; width: 44px; height: 44px; background: var(--color-primary); border: none; border-radius: 50%; color: white; font-size: 1.6rem; cursor: pointer; box-shadow: var(--shadow-md); align-items: center; justify-content: center; }
        .nav-frame {
            width: 18%; min-width: 220px; background: var(--color-primary); padding: 24px 16px; border-right: 2px solid var(--color-primary-dark);
            position: fixed; height: 100vh; overflow-y: auto; z-index: 100; box-shadow: 4px 0 20px rgba(62, 92, 102, 0.15);
            transition: transform 0.3s ease;
        }
        .logo { margin-bottom: 16px; padding: 12px; border-bottom: 2px solid #ffffff; text-align: center; background: rgba(255, 255, 255, 0.1); border-radius: 12px; }
        .logo h1 { color: #ffffff; font-size: 1.2rem; font-weight: 700; }
        .logo p { color: var(--color-bg); font-size: 0.75rem; opacity: 0.9; }
        .nav-section { margin-bottom: 20px; }
        .nav-title { color: rgba(255,255,255,0.7); font-size: 0.85em; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; padding-left: 8px; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; color: whitesmoke; text-decoration: none; border-radius: var(--radius-md); margin-bottom: 4px; transition: var(--transition); font-weight: 600; }
        .nav-item:hover { background: var(--color-primary-dark); transform: translateX(4px); }
        .nav-item.active { background: var(--color-accent); font-weight: 700; }
        .content-area { flex: 1; margin-left: 18%; padding: 24px 32px; max-width: 1600px; width: 100%; }

        /* ---------- КАРТОЧКА ---------- */
        .card {
            background: var(--color-bg-alt);
            border-radius: var(--radius-lg);
            padding: 24px;
            border: 2px solid var(--color-border);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            position: relative;
        }
        /* Заголовок – кликабельный для календаря */
        .clickable-title {
            cursor: pointer;
            display: inline-block;
        }
        .clickable-title:hover {
            opacity: 0.8;
        }
        .card h2 {
            color: var(--color-primary-dark);
            font-weight: 700;
            font-size: 1.4em;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        /* Календарь (выпадающий) – теперь позиционируется относительно заголовка */
        .calendar-popup {
            position: absolute;
            background: var(--color-bg-alt);
            border: 2px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: 12px;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            min-width: 280px;
            margin-top: 8px;
            right: 0;
            top: 60px; /* подстраиваем под высоту заголовка */
        }
        .calendar-popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }
        .calendar-grid div {
            padding: 6px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.75em;
            position: relative;
        }
        .calendar-grid div.header {
            font-weight: bold;
            color: var(--color-text-light);
            cursor: default;
        }
        .calendar-grid div.selected { background: var(--color-primary); color: white; }
        .calendar-grid div.today { border: 2px solid var(--color-primary); }
        .task-count-badge {
            position: absolute;
            bottom: 1px;
            right: 1px;
            background: var(--color-accent);
            color: white;
            font-size: 0.6em;
            border-radius: 12px;
            padding: 1px 5px;
            min-width: 18px;
        }

        /* ---------- НАВИГАЦИЯ ПО ДНЯМ (кнопки) ---------- */
        .date-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 12px;
            flex-wrap: wrap;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
        }
        .nav-buttons button {
            background: var(--color-secondary);
            border: none;
            padding: 8px 16px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            color: var(--color-text);
            transition: var(--transition);
        }
        .nav-buttons button:hover,
        .nav-buttons button.active {
            background: var(--color-primary);
            color: white;
        }

        /* ---------- ЗАДАЧИ ---------- */
        .task-list { display: flex; flex-direction: column; gap: 10px; }
        .task-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            border: 2px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            transition: var(--transition);
            cursor: grab;
            background: var(--color-bg-alt);
            position: relative;
        }
        .task-item:active { cursor: grabbing; }
        .task-item.dragging { opacity: 0.4; }
        .task-item.important-task {
            border-left: 6px solid var(--color-warning);
            background: linear-gradient(90deg, rgba(255, 217, 61, 0.15), var(--color-bg-alt));
        }
        .task-item.important-task:hover {
            background: linear-gradient(90deg, rgba(255, 217, 61, 0.25), var(--color-bg-alt));
        }
        .task-checkbox {
            width: 20px;
            height: 20px;
            accent-color: var(--color-accent);
            cursor: pointer;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .task-important-icon {
            position: absolute;
            top: 6px;
            left: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            color: var(--color-warning);
            transition: var(--transition);
            line-height: 1;
            z-index: 2;
        }
        .task-important-icon:hover { transform: scale(1.1); }
        .task-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-left: 6px;
        }
        .task-time { font-size: 0.7em; font-weight: 600; opacity: 0.8; }
        .task-title-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
        .task-title { font-size: 0.95em; font-weight: 500; color: inherit; word-break: break-word; }
        .task-title.completed { text-decoration: line-through; opacity: 0.6; }
        .task-category {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7em;
            font-weight: 500;
            background: rgba(0,0,0,0.05);
            padding: 2px 8px;
            border-radius: 20px;
            width: fit-content;
        }
        .delete-task-btn {
            background: rgba(0, 0, 0, 0.2);
            border: none;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.8em;
            font-weight: 600;
            color: var(--color-text);
            transition: var(--transition);
            flex-shrink: 0;
            align-self: center;
        }
        .delete-task-btn:hover { background: rgba(0, 0, 0, 0.4); }
        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--color-text-muted);
            background: var(--color-primary-light);
            border-radius: var(--radius-lg);
            border: 2px dashed var(--color-border);
            font-weight: 500;
        }

        /* ---------- ПЛАВАЮЩАЯ КНОПКА ДОБАВЛЕНИЯ ---------- */
        .fab-add-task {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2em;
            font-weight: bold;
            box-shadow: var(--shadow-lg);
            z-index: 999;
            border: none;
            cursor: pointer;
            color: white;
            transition: var(--transition);
        }
        .fab-add-task:hover { transform: scale(1.05); }

        /* ---------- НАСТРОЙКИ КАТЕГОРИЙ (кнопка) ---------- */
        .cat-settings-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--color-text-muted);
            transition: var(--transition);
            opacity: 0.5;
        }
        .cat-settings-btn:hover { opacity: 1; color: var(--color-primary-dark); }

        /* ---------- МОДАЛЬНЫЕ ОКНА ---------- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(62, 92, 102, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: var(--radius-xl);
            padding: 24px;
            width: 100%;
            max-width: 500px;
            border: 2px solid var(--color-border);
            box-shadow: var(--shadow-lg);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--color-border);
        }
        .modal-header h3 { color: var(--color-primary); font-weight: 700; margin: 0; }
        .close-modal { background: none; border: none; font-size: 1.6em; cursor: pointer; color: var(--color-primary); }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: var(--color-primary-dark); }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; background: var(--color-bg); border: 2px solid var(--color-border); border-radius: var(--radius-md); }
        .save-btn {
            width: 100%;
            padding: 12px;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .save-btn:hover { background: var(--color-primary-dark); transform: translateY(-2px); }

        /* ---------- НАСТРОЙКИ КАТЕГОРИЙ ---------- */
        .categories-list-edit {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .category-edit-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            background: var(--color-bg);
            border-radius: var(--radius-md);
        }
        .category-edit-item input[type="text"] {
            flex: 1;
            border: 1px solid var(--color-border);
            background: white;
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
        }
        .category-edit-item input[type="color"] {
            width: 40px;
            height: 32px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            cursor: pointer;
        }
        .category-edit-item button {
            background: var(--color-error);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            width: 28px;
            height: 28px;
            cursor: pointer;
        }
        .add-category-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .add-category-row input {
            flex: 1;
            padding: 10px;
            background: var(--color-bg);
            border: 2px solid var(--color-border);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
        }
        .add-category-row button {
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            padding: 0 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .add-category-row button:hover { background: var(--color-primary-dark); }

        /* ---------- УВЕДОМЛЕНИЯ ---------- */
        .notification-toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: var(--color-accent);
            color: white;
            padding: 10px 20px;
            border-radius: var(--radius-xl);
            font-size: 0.85em;
            z-index: 1100;
            box-shadow: var(--shadow-md);
            animation: fadeInOut 3s ease forwards;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(20px); }
            10% { opacity: 1; transform: translateY(0); }
            90% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        /* ---------- АДАПТИВНОСТЬ (МОБИЛЬНАЯ) ---------- */
        @media (max-width: 1024px) {
            .app-layout { flex-direction: column; }
            .nav-frame {
                width: 100%;
                height: auto;
                position: relative;
                flex-direction: row;
                flex-wrap: wrap;
                padding: 12px 16px;
                border-right: none;
                border-bottom: 2px solid var(--color-primary);
            }
            .content-area { margin-left: 0; padding: 20px; }
        }
        @media (max-width: 768px) {
            .burger-btn { display: flex; }
            .nav-frame {
                transform: translateX(-100%);
                width: 80%;
                max-width: 280px;
                position: fixed;
                top: 0;
                left: 0;
                flex-direction: column;
                border-bottom: none;
                border-right: 2px solid var(--color-primary-dark);
            }
            .nav-frame.open { transform: translateX(0); }
            .content-area { margin-left: 0; padding: 60px 16px 16px; }
            .overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.4);
                z-index: 99;
            }
            .overlay.active { display: block; }
            .calendar-popup {
                top: 70px;
                right: 10px;
                left: auto;
            }
            .fab-add-task { bottom: 20px; right: 20px; width: 50px; height: 50px; font-size: 1.8em; }
            .task-item { padding: 8px 12px; gap: 10px; }
            .task-checkbox { width: 22px; height: 22px; }
            .task-important-icon { font-size: 0.8rem; top: 4px; left: 4px; }
            .delete-task-btn { margin-left: auto; padding: 4px 10px; }
        }
        .overlay { display: none; }
    </style>
</head>
<body>
    <button class="burger-btn" id="burgerBtn">☰</button>
    <div class="overlay" id="overlay"></div>
    <div class="app-layout">
        <nav class="nav-frame" id="navFrame">
            <div class="logo"><h1>📅 LifeDashboard</h1><p>Полный набор для продуктивности</p></div>
            <div class="nav-section"><div class="nav-title">ГЛАВНОЕ</div><a href="index.html" class="nav-item">🏠 Главная</a><a href="day.html" class="nav-item active">📆 План на день</a></div>
            <div class="nav-section"><div class="nav-title">ПЛАНИРОВАНИЕ</div><a href="week.html" class="nav-item">📋 Неделя</a><a href="month.html" class="nav-item">🗓️ Месяц</a><a href="year.html" class="nav-item">🎯 Год</a></div>
            <div class="nav-section"><div class="nav-title">ТРЕКЕРЫ</div><a href="habits.html" class="nav-item">🔥 Привычки</a><a href="finance.html" class="nav-item">💰 Финансы</a><a href="media.html" class="nav-item">📚🎬 Книги и фильмы</a><a href="study.html" class="nav-item">📚 Учёба</a><a href="pomodoro.html" class="nav-item">🍅 Таймер помодоро</a></div>
        </nav>
        <div class="content-area">
            <div class="card">
                <h2>
                    <span class="clickable-title" id="calendarToggleBtn">📆 План на день</span>
                    <button class="cat-settings-btn" onclick="openCategoriesModal()" title="Настройка категорий">⚙️</button>
                </h2>
                <!-- календарь теперь один, привязан к заголовку -->
                <div id="calendarPopup" class="calendar-popup" style="display: none;">
                    <div class="calendar-popup-header">
                        <button onclick="prevMonthPopup()">◀</button>
                        <h3 id="calendarMonthYear"></h3>
                        <button onclick="nextMonthPopup()">▶</button>
                    </div>
                    <div class="calendar-grid" id="calendarGrid"></div>
                </div>

                <div class="date-navigation">
                    <div class="nav-buttons">
                        <button onclick="goToPrevDay()">◀ <span id="prevDayLabel"></span></button>
                        <button onclick="goToToday()" id="todayBtn">Сегодня</button>
                        <button onclick="goToNextDay()"><span id="nextDayLabel"></span> ▶</button>
                    </div>
                </div>
                <div id="dayPlannerContent"></div>
            </div>
        </div>
    </div>

    <button class="fab-add-task" onclick="openAddTaskModal()">+</button>

    <!-- Модальное окно добавления задачи -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3>➕ Новая задача</h3><button class="close-modal" onclick="closeTaskModal()">✖</button></div>
            <div class="form-group"><label>Название</label><input type="text" id="newTaskTitle" placeholder="Что нужно сделать?"></div>
            <div class="form-group"><label>Категория</label><select id="newTaskCategory"></select></div>
            <div class="form-group"><label>Время (необязательно)</label><input type="time" id="newTaskTime"></div>
            <div class="form-group"><label style="display: flex; align-items: center; gap: 8px;"><input type="checkbox" id="newTaskImportant" style="width: 20px; height: 20px; accent-color: var(--color-accent);"><span>⭐ Важная задача</span></label></div>
            <button class="save-btn" onclick="saveNewTask()">💾 Сохранить</button>
        </div>
    </div>

    <!-- Модальное окно настроек категорий -->
    <div id="categoriesModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3>⚙️ Категории задач</h3><button class="close-modal" onclick="closeCategoriesModal()">✖</button></div>
            <div class="categories-list-edit" id="categoriesListEdit"></div>
            <div class="add-category-row"><input type="text" id="newCategoryName" placeholder="Название категории"><button onclick="addNewCategory()">➕</button></div>
            <button class="save-btn" onclick="saveCategoriesSettings()" style="margin-top: 16px;">💾 Сохранить</button>
        </div>
    </div>

    <script>
        // ----------------------------- Данные -----------------------------
        let allTasks = JSON.parse(localStorage.getItem('allTasks')) || {};
        let currentDate = new Date();
        let savedDate = localStorage.getItem('dayPlannerCurrentDate');
        if (savedDate) currentDate = new Date(savedDate);

        let taskCategories = JSON.parse(localStorage.getItem('taskCategories')) || [
            { id: 'other', name: 'Без категории', color: '#E6E1D7' }
        ];

        const CATEGORY_COLORS = [
            '#B8CCE4', '#C8DFCF', '#F2E3D4', '#DCCFEC', '#F9E8D1', '#CBE2DA', '#DBDDF0',
            '#F0D9DA', '#D4E6F1', '#D5F5E3', '#FDEBD0', '#E8DAEF', '#D1F2EB', '#FADBD8',
            '#E5E8E8', '#F5EEF5', '#E8F8F5', '#FEF9E7'
        ];

        let firebaseReady = false, db = null, currentUser = null;
        const firebaseConfig = {
            apiKey: "AIzaSyARKWwV3cggOhda9g6cDNcEAGOpUN4O63I",
            authDomain: "lifedashbord.firebaseapp.com",
            projectId: "lifedashbord",
            storageBucket: "lifedashbord.appspot.com",
            messagingSenderId: "206574362724",
            appId: "1:206574362724:web:83887cae4dc87b41137f71"
        };

        let calendarCurrentMonth = currentDate.getMonth();
        let calendarCurrentYear = currentDate.getFullYear();
        let notifiedTasks = new Set();

        // ----------------------------- Напоминания -----------------------------
        function checkReminders() {
            const now = new Date();
            const todayKey = getDateKey(now);
            const tasks = allTasks[todayKey]?.tasks || [];
            tasks.forEach(task => {
                if (task.startTime && !task.completed) {
                    const [hours, minutes] = task.startTime.split(':');
                    const taskTime = new Date();
                    taskTime.setHours(parseInt(hours), parseInt(minutes), 0, 0);
                    const diff = Math.abs(now - taskTime);
                    const taskId = task.id;
                    if (diff <= 60 * 1000 && !notifiedTasks.has(taskId)) {
                        notifiedTasks.add(taskId);
                        showNotification(`🔔 Напоминание: ${task.text} в ${task.startTime}`);
                        try { new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbqWEyMmih0NupYTIyaKHQ26lhMjJoodDbqWEyMmih0NupYTIy').play(); } catch(e) {}
                    }
                }
            });
        }
        function showNotification(message) {
            const toast = document.createElement('div');
            toast.className = 'notification-toast';
            toast.innerText = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        setInterval(checkReminders, 60000);
        setTimeout(checkReminders, 1000);

        // ----------------------------- Инициализация -----------------------------
        document.addEventListener('DOMContentLoaded', () => {
            initFirebase();
            updateDateDisplay();
            renderDayPlanner();

            const burger = document.getElementById('burgerBtn');
            const nav = document.getElementById('navFrame');
            const overlay = document.getElementById('overlay');
            burger.addEventListener('click', () => { nav.classList.toggle('open'); overlay.classList.toggle('active'); });
            overlay.addEventListener('click', () => { nav.classList.remove('open'); overlay.classList.remove('active'); });

            // Клик по заголовку открывает/закрывает календарь
            const titleBtn = document.getElementById('calendarToggleBtn');
            const popup = document.getElementById('calendarPopup');
            titleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (popup.style.display === 'block') {
                    popup.style.display = 'none';
                } else {
                    // Обновляем месяц и год перед показом
                    calendarCurrentMonth = currentDate.getMonth();
                    calendarCurrentYear = currentDate.getFullYear();
                    renderCalendarPopup();
                    popup.style.display = 'block';
                }
            });

            // Закрытие по клику вне календаря и не по заголовку
            document.addEventListener('click', (e) => {
                if (popup && popup.style.display === 'block' && !popup.contains(e.target) && !titleBtn.contains(e.target)) {
                    popup.style.display = 'none';
                }
            });
        });

        // ----------------------------- Firebase -----------------------------
        function initFirebase() {
            let timeout = setTimeout(() => { firebaseReady = false; }, 5000);
            try {
                if (typeof firebase === 'undefined') { clearTimeout(timeout); return; }
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                firebase.auth().onAuthStateChanged(user => {
                    clearTimeout(timeout);
                    if (user) { currentUser = user; firebaseReady = true; loadUserTasks(); loadUserCategories(); }
                    else { firebaseReady = false; }
                });
            } catch(e) { clearTimeout(timeout); firebaseReady = false; }
        }
        function loadUserTasks() {
            if (!currentUser || !db) return;
            db.collection('users').doc(currentUser.uid).collection('tasks').get().then(snap => {
                let loaded = {};
                snap.forEach(doc => { loaded[doc.id] = doc.data(); });
                if (JSON.stringify(allTasks) !== JSON.stringify(loaded)) {
                    allTasks = loaded;
                    localStorage.setItem('allTasks', JSON.stringify(allTasks));
                    renderDayPlanner();
                }
            });
        }
        function loadUserCategories() {
            if (!currentUser || !db) return;
            db.collection('users').doc(currentUser.uid).collection('settings').doc('taskCategories').get().then(doc => {
                if (doc.exists && doc.data().categories) {
                    taskCategories = doc.data().categories;
                    localStorage.setItem('taskCategories', JSON.stringify(taskCategories));
                    renderDayPlanner();
                }
            });
        }
        function saveAllTasks() {
            localStorage.setItem('allTasks', JSON.stringify(allTasks));
            if (firebaseReady && currentUser && db) {
                Object.keys(allTasks).forEach(dateKey => {
                    db.collection('users').doc(currentUser.uid).collection('tasks').doc(dateKey).set(allTasks[dateKey]);
                });
            }
        }
        function saveCategories() {
            localStorage.setItem('taskCategories', JSON.stringify(taskCategories));
            if (firebaseReady && currentUser && db) {
                db.collection('users').doc(currentUser.uid).collection('settings').doc('taskCategories').set({ categories: taskCategories });
            }
            renderDayPlanner();
            populateCategorySelect();
        }

        // ----------------------------- Вспомогательные -----------------------------
        function getDateKey(date) { return date.toISOString().split('T')[0]; }
        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
        function formatDateDisplay(date) { return date.toLocaleDateString('ru-RU', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }); }
        function formatDateShort(date) { return date.toLocaleDateString('ru-RU', { month: 'short', day: 'numeric' }); }
        function updateDateDisplay() {
            // дата уже не отображается на кнопке, но нужна для навигации
            localStorage.setItem('dayPlannerCurrentDate', currentDate.toISOString());
            let prevDate = new Date(currentDate); prevDate.setDate(prevDate.getDate() - 1);
            let nextDate = new Date(currentDate); nextDate.setDate(nextDate.getDate() + 1);
            document.getElementById('prevDayLabel').textContent = formatDateShort(prevDate);
            document.getElementById('nextDayLabel').textContent = formatDateShort(nextDate);
            let today = new Date(); today.setHours(0,0,0,0);
            let curr = new Date(currentDate); curr.setHours(0,0,0,0);
            document.getElementById('todayBtn').classList.toggle('active', curr.getTime() === today.getTime());
        }
        window.goToPrevDay = function() { currentDate.setDate(currentDate.getDate() - 1); updateDateDisplay(); renderDayPlanner(); };
        window.goToNextDay = function() { currentDate.setDate(currentDate.getDate() + 1); updateDateDisplay(); renderDayPlanner(); };
        window.goToToday = function() { currentDate = new Date(); updateDateDisplay(); renderDayPlanner(); };

        // ----------------------------- Календарь -----------------------------
        function getTaskCountsForMonth(year, month) {
            const counts = {};
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const tasks = allTasks[dateStr]?.tasks || [];
                counts[dateStr] = { total: tasks.length };
            }
            return counts;
        }
        function renderCalendarPopup() {
            const firstDay = new Date(calendarCurrentYear, calendarCurrentMonth, 1);
            const startDay = firstDay.getDay();
            const daysInMonth = new Date(calendarCurrentYear, calendarCurrentMonth + 1, 0).getDate();
            const counts = getTaskCountsForMonth(calendarCurrentYear, calendarCurrentMonth);
            document.getElementById('calendarMonthYear').textContent = firstDay.toLocaleString('ru-RU', { month: 'long', year: 'numeric' });
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(d => {
                let h = document.createElement('div'); h.className = 'header'; h.textContent = d; grid.appendChild(h);
            });
            let startOffset = (startDay === 0 ? 6 : startDay - 1);
            for (let i = 0; i < startOffset; i++) { grid.appendChild(document.createElement('div')); }
            const today = new Date();
            const selectedKey = getDateKey(currentDate);
            for (let d = 1; d <= daysInMonth; d++) {
                let cell = document.createElement('div');
                let dateStr = `${calendarCurrentYear}-${String(calendarCurrentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                cell.textContent = d;
                if (dateStr === selectedKey) cell.classList.add('selected');
                if (today.getFullYear() === calendarCurrentYear && today.getMonth() === calendarCurrentMonth && today.getDate() === d) cell.classList.add('today');
                const taskCount = counts[dateStr]?.total || 0;
                if (taskCount > 0) {
                    const badge = document.createElement('span');
                    badge.className = 'task-count-badge';
                    badge.textContent = taskCount;
                    cell.style.position = 'relative';
                    cell.appendChild(badge);
                }
                cell.onclick = (function(date) { return function() {
                    currentDate = new Date(date);
                    updateDateDisplay();
                    renderDayPlanner();
                    document.getElementById('calendarPopup').style.display = 'none';
                }; })(dateStr);
                grid.appendChild(cell);
            }
        }
        window.prevMonthPopup = function() { calendarCurrentMonth--; if (calendarCurrentMonth < 0) { calendarCurrentMonth = 11; calendarCurrentYear--; } renderCalendarPopup(); };
        window.nextMonthPopup = function() { calendarCurrentMonth++; if (calendarCurrentMonth > 11) { calendarCurrentMonth = 0; calendarCurrentYear++; } renderCalendarPopup(); };

        // ----------------------------- Рендер задач (drag-and-drop) -----------------------------
        let draggedItem = null;
        function handleDragStart(e, index) {
            draggedItem = { index, dateKey: getDateKey(currentDate) };
            e.target.classList.add('dragging');
        }
        function handleDragOver(e) { e.preventDefault(); }
        function handleDrop(e, targetIndex) {
            e.preventDefault();
            const targetItem = e.target.closest('.task-item');
            if (!targetItem) return;
            const sourceKey = draggedItem.dateKey;
            const targetKey = getDateKey(currentDate);
            if (sourceKey !== targetKey) return;
            const tasks = allTasks[targetKey].tasks;
            const [moved] = tasks.splice(draggedItem.index, 1);
            tasks.splice(targetIndex, 0, moved);
            saveAllTasks();
            renderDayPlanner();
        }
        function handleDragEnd(e) { e.target.classList.remove('dragging'); draggedItem = null; }
        window.handleDragStart = handleDragStart;
        window.handleDragOver = handleDragOver;
        window.handleDrop = handleDrop;
        window.handleDragEnd = handleDragEnd;

        function renderDayPlanner() {
            const container = document.getElementById('dayPlannerContent');
            const key = getDateKey(currentDate);
            const tasks = allTasks[key]?.tasks || [];
            let tasksHtml = '';
            if (tasks.length === 0) {
                tasksHtml = '<div class="empty-state">📭 Нет задач на этот день. Нажмите +, чтобы добавить!</div>';
            } else {
                tasksHtml = '<div class="task-list">';
                tasks.forEach((task, idx) => {
                    let catId = task.category || 'other';
                    const cat = taskCategories.find(c => c.id === catId) || taskCategories[0];
                    const catColor = cat.color || '#E6E1D7';
                    const timeHtml = task.startTime ? `<div class="task-time">⏰ ${task.startTime}</div>` : '';
                    const completedClass = task.completed ? 'completed' : '';
                    const importantClass = task.important ? 'important-task' : '';
                    tasksHtml += `
                        <div class="task-item ${importantClass}" draggable="true" style="background: ${catColor};"
                            ondragstart="handleDragStart(event, ${idx})" ondragover="handleDragOver(event)" ondragend="handleDragEnd(event)"
                            ondrop="handleDrop(event, ${idx})">
                            <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTaskComplete('${key}', ${idx}, this.checked)">
                            <div class="task-content">
                                ${timeHtml}
                                <div class="task-title-row">
                                    <div class="task-title ${completedClass}">${escapeHtml(task.text)}</div>
                                </div>
                                <div class="task-category" style="background: ${catColor}40;">${cat.name}</div>
                            </div>
                            <button class="delete-task-btn" onclick="deleteTaskQuick('${key}', ${idx}, event)">✖</button>
                        </div>
                    `;
                });
                tasksHtml += '</div>';
                setTimeout(() => {
                    const items = document.querySelectorAll('.task-item');
                    items.forEach((item, i) => {
                        if (!item.querySelector('.task-important-icon') && tasks[i]?.important) {
                            const icon = document.createElement('button');
                            icon.className = 'task-important-icon';
                            icon.innerHTML = '⭐';
                            icon.onclick = (e) => { e.stopPropagation(); toggleTaskImportant(key, i); };
                            item.insertBefore(icon, item.firstChild);
                        } else if (!tasks[i]?.important) {
                            const existing = item.querySelector('.task-important-icon');
                            if (existing) existing.remove();
                        }
                    });
                }, 0);
            }
            container.innerHTML = tasksHtml;
        }

        // ----------------------------- Операции с задачами -----------------------------
        window.toggleTaskComplete = function(dateKey, idx, checked) {
            if (!allTasks[dateKey]?.tasks?.[idx]) return;
            allTasks[dateKey].tasks[idx].completed = checked;
            saveAllTasks();
            renderDayPlanner();
        };
        window.toggleTaskImportant = function(dateKey, idx) {
            if (!allTasks[dateKey]?.tasks?.[idx]) return;
            const task = allTasks[dateKey].tasks[idx];
            task.important = !task.important;
            saveAllTasks();
            renderDayPlanner();
        };
        window.deleteTaskQuick = function(dateKey, idx, event) {
            event.stopPropagation();
            if (!allTasks[dateKey]?.tasks?.[idx]) return;
            allTasks[dateKey].tasks.splice(idx, 1);
            if (allTasks[dateKey].tasks.length === 0) delete allTasks[dateKey];
            saveAllTasks();
            renderDayPlanner();
        };

        // ----------------------------- Модальное окно задачи -----------------------------
        function populateCategorySelect() {
            const select = document.getElementById('newTaskCategory');
            select.innerHTML = '';
            taskCategories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat.id;
                option.textContent = cat.name;
                select.appendChild(option);
            });
        }
        window.openAddTaskModal = function() {
            populateCategorySelect();
            document.getElementById('newTaskTitle').value = '';
            document.getElementById('newTaskTime').value = '';
            document.getElementById('newTaskImportant').checked = false;
            document.getElementById('taskModal').classList.add('active');
        };
        window.closeTaskModal = function() { document.getElementById('taskModal').classList.remove('active'); };
        window.saveNewTask = function() {
            const title = document.getElementById('newTaskTitle').value.trim();
            if (!title) { alert('Введите название задачи'); return; }
            const category = document.getElementById('newTaskCategory').value;
            const time = document.getElementById('newTaskTime').value;
            const important = document.getElementById('newTaskImportant').checked;
            const dateKey = getDateKey(currentDate);
            if (!allTasks[dateKey]) allTasks[dateKey] = { tasks: [] };
            allTasks[dateKey].tasks.push({
                id: Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                text: title,
                category: category,
                startTime: time || null,
                important: important,
                completed: false
            });
            saveAllTasks();
            closeTaskModal();
            renderDayPlanner();
        };

        // ----------------------------- Настройки категорий -----------------------------
        function getRandomCategoryColor() {
            const usedColors = taskCategories.map(c => c.color).filter(c => c);
            const available = CATEGORY_COLORS.filter(c => !usedColors.includes(c));
            if (available.length) return available[0];
            return CATEGORY_COLORS[Math.floor(Math.random() * CATEGORY_COLORS.length)];
        }
        function renderCategoriesEditList() {
            const container = document.getElementById('categoriesListEdit');
            container.innerHTML = '';
            taskCategories.forEach((cat, idx) => {
                if (cat.id === 'other') return;
                const div = document.createElement('div');
                div.className = 'category-edit-item';
                div.innerHTML = `
                    <input type="text" value="${escapeHtml(cat.name)}" data-idx="${idx}" class="edit-cat-name">
                    <input type="color" value="${cat.color}" data-idx="${idx}" class="edit-cat-color">
                    <button onclick="removeCategory(${idx})">✖</button>
                `;
                container.appendChild(div);
            });
            document.querySelectorAll('.edit-cat-name').forEach(input => {
                input.addEventListener('change', (e) => {
                    const idx = parseInt(e.target.dataset.idx);
                    taskCategories[idx].name = e.target.value.trim() || 'Категория';
                    saveCategories();
                    renderCategoriesEditList();
                    populateCategorySelect();
                    renderDayPlanner();
                });
            });
            document.querySelectorAll('.edit-cat-color').forEach(input => {
                input.addEventListener('change', (e) => {
                    const idx = parseInt(e.target.dataset.idx);
                    taskCategories[idx].color = e.target.value;
                    saveCategories();
                    renderDayPlanner();
                });
            });
        }
        window.openCategoriesModal = function() {
            renderCategoriesEditList();
            document.getElementById('categoriesModal').classList.add('active');
        };
        window.closeCategoriesModal = function() { document.getElementById('categoriesModal').classList.remove('active'); };
        window.addNewCategory = function() {
            const name = document.getElementById('newCategoryName').value.trim();
            if (!name) return;
            const newId = 'cat_' + Date.now();
            taskCategories.push({ id: newId, name: name, color: getRandomCategoryColor() });
            saveCategories();
            document.getElementById('newCategoryName').value = '';
            renderCategoriesEditList();
            populateCategorySelect();
        };
        window.removeCategory = function(idx) {
            if (taskCategories[idx].id === 'other') {
                alert('Нельзя удалить категорию "Без категории"');
                return;
            }
            taskCategories.splice(idx, 1);
            saveCategories();
            renderCategoriesEditList();
            populateCategorySelect();
            renderDayPlanner();
        };
        window.saveCategoriesSettings = function() { closeCategoriesModal(); };
    </script>
</body>
</html>
