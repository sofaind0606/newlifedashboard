<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LifeDashboard | Трекер учёбы</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        /* ========== КРЕМОВО-ГОЛУБАЯ ГАММА ========== */
        :root {
            --color-primary: #93ABDB;
            --color-primary-dark: #768FC2;
            --color-primary-light: #C2D4F5;
            --color-secondary: #FAF4CD;
            --color-secondary-dark: #E6DFB3;
            --color-secondary-light: #FFF9E6;
            --color-accent: #5B6F9E;
            --color-text: #3D4A66;
            --color-text-light: #6B7C9E;
            --color-text-muted: #A5B3CC;
            --color-nav: #93ABDB;
            --color-nav-light: #A6BCE8;
            --color-border: #FAF4CD;
            --color-border-light: #FFF4E0;
            --color-bg: #FDFBF0;
            --color-bg-alt: #FFFFFF;
            --color-success: #6BCB77;
            --color-warning: #FFD93D;
            --color-danger: #E15554;
            --shadow-sm: 0 2px 8px rgba(91, 111, 158, 0.05);
            --shadow-md: 0 4px 15px rgba(91, 111, 158, 0.08);
            --shadow-lg: 0 10px 30px rgba(91, 111, 158, 0.12);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--color-bg); min-height: 100vh; color: var(--color-text); line-height: 1.5; }

        /* ========== НАВИГАЦИЯ (десктоп + бургер) ========== */
        .app-layout { display: flex; min-height: 100vh; position: relative; overflow-x: hidden; }
        .burger-btn { display: none; position: fixed; top: 16px; left: 16px; z-index: 1001; width: 44px; height: 44px; background: var(--color-primary); border: none; border-radius: 50%; color: white; font-size: 1.6rem; cursor: pointer; box-shadow: var(--shadow-md); align-items: center; justify-content: center; }
        .nav-frame {
            width: 18%; min-width: 220px; background: var(--color-primary); padding: 24px 16px; border-right: 2px solid var(--color-primary-dark);
            position: fixed; height: 100vh; overflow-y: auto; z-index: 100; box-shadow: 4px 0 20px rgba(62, 92, 102, 0.15);
            transition: transform 0.3s ease;
        }
        .logo { margin-bottom: 16px; padding: 12px; border-bottom: 2px solid #ffffff; text-align: center; background: rgba(255, 255, 255, 0.1); border-radius: 12px; }
        .logo h1 { color: #ffffff; font-size: 1.2rem; font-weight: 700; }
        .logo p { color: var(--color-bg); font-size: 0.75rem; opacity: 0.9; }
        .nav-section { margin-bottom: 20px; }
        .nav-title { color: rgba(255,255,255,0.7); font-size: 0.85em; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; padding-left: 8px; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; color: whitesmoke; text-decoration: none; border-radius: var(--radius-md); margin-bottom: 4px; transition: var(--transition); font-weight: 600; }
        .nav-item:hover { background: var(--color-primary-dark); transform: translateX(4px); }
        .nav-item.active { background: var(--color-accent); font-weight: 700; }
        .content-area { flex: 1; margin-left: 18%; padding: 24px 32px; max-width: 1600px; width: 100%; }

        /* ========== ОСНОВНОЙ КОНТЕНТ ========== */
        .study-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 12px;
        }
        .study-header h1 {
            font-size: 1.6em; font-weight: 700; color: var(--color-primary-dark);
        }
        .add-subject-btn {
            padding: 10px 20px; background: linear-gradient(135deg, var(--color-primary), var(--color-nav));
            color: white; border: none; border-radius: var(--radius-lg); font-weight: 600;
            cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 8px;
        }
        .add-subject-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

        .tab-navigation {
            display: flex; gap: 12px; margin-bottom: 25px; border-bottom: 2px solid var(--color-border-light); padding-bottom: 8px;
        }
        .tab-btn {
            background: none; border: none; padding: 10px 20px; font-size: 0.95rem; font-weight: 600;
            color: var(--color-text-light); cursor: pointer; border-radius: var(--radius-md); transition: var(--transition);
        }
        .tab-btn.active { background: var(--color-primary); color: white; }
        .tab-btn:hover:not(.active) { background: var(--color-primary-light); color: var(--color-text); }

        /* Сетка предметов */
        .subjects-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px;
        }
        .subject-card {
            background: var(--color-bg-alt); border-radius: var(--radius-lg); border: 2px solid var(--color-border-light);
            padding: 20px; transition: var(--transition); cursor: pointer; position: relative;
        }
        .subject-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: var(--color-primary); }
        .subject-icon { font-size: 2.5em; margin-bottom: 12px; }
        .subject-title { font-weight: 700; font-size: 1.1em; color: var(--color-text); margin-bottom: 8px; }
        .subject-tasks { font-size: 0.8em; color: var(--color-text-light); margin-top: 8px; }
        .subject-progress { margin-top: 12px; height: 6px; background: var(--color-border-light); border-radius: 3px; overflow: hidden; }
        .subject-progress-fill { height: 100%; background: var(--color-primary); transition: width 0.3s ease; }
        .delete-subject-btn {
            position: absolute; top: 10px; right: 10px; background: var(--color-danger); color: white;
            border: none; padding: 4px 8px; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.7em;
            opacity: 0; transition: var(--transition);
        }
        .subject-card:hover .delete-subject-btn { opacity: 1; }
        .delete-subject-btn:hover { background: #c0392b; }

        /* Вкладка "Все задачи" */
        .pending-full-list {
            background: var(--color-bg-alt); border-radius: var(--radius-lg); border: 2px solid var(--color-border-light);
            padding: 24px;
        }
        .pending-full-header { margin-bottom: 20px; }
        .pending-full-title { font-size: 1.2em; font-weight: 700; color: var(--color-text); }

        /* Задачи (общие и внутри предмета) */
        .task-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            border-radius: var(--radius-md); margin-bottom: 10px; background: var(--color-bg-alt);
            border: 1px solid var(--color-border-light); transition: var(--transition);
        }
        .task-item:hover { transform: translateX(4px); box-shadow: var(--shadow-sm); }
        .task-checkbox { width: 18px; height: 18px; accent-color: var(--color-primary); cursor: pointer; }
        .task-content { flex: 1; }
        .task-title { font-weight: 600; color: var(--color-text); }
        .task-title.completed { text-decoration: line-through; opacity: 0.6; }
        .task-meta { font-size: 0.75em; color: var(--color-text-light); margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
        .task-deadline { background: var(--color-primary-light); padding: 2px 8px; border-radius: 12px; }
        .task-subject { background: var(--color-secondary-light); padding: 2px 8px; border-radius: 12px; }
        .delete-task-btn { background: var(--color-danger); color: white; border: none; border-radius: var(--radius-sm); padding: 4px 10px; cursor: pointer; font-size: 0.75em; transition: var(--transition); }
        .delete-task-btn:hover { background: #c0392b; transform: scale(1.05); }

        /* Заголовок предмета и кнопка добавления задачи */
        .tasks-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
        }
        .tasks-title { font-size: 1.3em; font-weight: 700; color: var(--color-text); }
        .inline-add-task-btn {
            background: var(--color-primary); color: white; border: none; width: 36px; height: 36px;
            border-radius: 50%; font-size: 1.2em; cursor: pointer; transition: var(--transition);
            display: inline-flex; align-items: center; justify-content: center;
        }
        .inline-add-task-btn:hover { transform: scale(1.05); background: var(--color-primary-dark); }

        /* Плавающая кнопка добавления задачи (глобальная) */
        .fab-add-task {
            position: fixed; bottom: 30px; right: 30px; width: 56px; height: 56px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-nav)); color: white;
            border: none; border-radius: 50%; font-size: 1.8em; cursor: pointer;
            box-shadow: var(--shadow-lg); transition: var(--transition); display: flex;
            align-items: center; justify-content: center; z-index: 200;
        }
        .fab-add-task:hover { transform: scale(1.1); }
        .fab-add-task.hidden { display: none; }

        /* Модальные окна */
        .modal {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(62, 92, 102, 0.5); backdrop-filter: blur(5px); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--color-bg-alt); border-radius: var(--radius-xl); padding: 24px;
            width: 100%; max-width: 500px; border: 2px solid var(--color-border); box-shadow: var(--shadow-lg);
            max-height: 90vh; overflow-y: auto;
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
            padding-bottom: 12px; border-bottom: 2px solid var(--color-border);
        }
        .modal-header h3 { color: var(--color-primary); font-weight: 700; margin: 0; font-size: 1.2em; }
        .close-modal { background: none; border: none; font-size: 1.4em; cursor: pointer; color: var(--color-primary); }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: var(--color-primary-dark); font-size: 0.9em; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; background: var(--color-bg); border: 2px solid var(--color-border); border-radius: var(--radius-md); font-size: 0.95em; }
        .save-btn {
            width: 100%; padding: 12px; background: linear-gradient(135deg, var(--color-primary), var(--color-nav));
            color: white; border: none; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; transition: var(--transition);
        }
        .save-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .empty-state {
            text-align: center; padding: 40px; color: var(--color-text-muted);
            background: var(--color-primary-light); border-radius: var(--radius-lg); border: 2px dashed var(--color-border);
        }

        /* Адаптивность */
        @media (max-width: 1024px) {
            .app-layout { flex-direction: column; }
            .nav-frame { width: 100%; height: auto; position: relative; flex-direction: row; flex-wrap: wrap; padding: 12px 16px; border-right: none; border-bottom: 2px solid var(--color-primary); }
            .nav-section { flex-direction: row; gap: 8px; }
            .nav-title { display: none; }
            .nav-item { padding: 8px 12px; font-size: 0.85em; }
            .content-area { margin-left: 0; padding: 20px; }
        }
        @media (max-width: 768px) {
            .burger-btn { display: flex; }
            .nav-frame { transform: translateX(-100%); width: 80%; max-width: 280px; position: fixed; top: 0; left: 0; flex-direction: column; border-bottom: none; border-right: 2px solid var(--color-primary-dark); }
            .nav-frame.open { transform: translateX(0); }
            .content-area { margin-left: 0; padding: 60px 16px 16px; }
            .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 999; }
            .overlay.active { display: block; }
            .subjects-grid { grid-template-columns: 1fr; }
        }
        .overlay { display: none; }
    </style>
</head>
<body>
    <button class="burger-btn" id="burgerBtn">☰</button>
    <div class="overlay" id="overlay"></div>
    <div class="app-layout">
        <nav class="nav-frame" id="navFrame">
            <div class="logo"><h1>📅 LifeDashboard</h1><p>Полный набор для продуктивности</p></div>
            <div class="nav-section"><div class="nav-title">ГЛАВНОЕ</div><a href="index.html" class="nav-item">🏠 Главная</a><a href="day.html" class="nav-item">📆 План на день</a></div>
            <div class="nav-section"><div class="nav-title">ПЛАНИРОВАНИЕ</div><a href="week.html" class="nav-item">📋 Неделя</a><a href="month.html" class="nav-item">🗓️ Месяц</a><a href="year.html" class="nav-item">🎯 Год</a></div>
            <div class="nav-section"><div class="nav-title">ТРЕКЕРЫ</div><a href="habits.html" class="nav-item">🔥 Привычки</a><a href="finance.html" class="nav-item">💰 Финансы</a><a href="media.html" class="nav-item">📚🎬 Книги и фильмы</a><a href="study.html" class="nav-item active">📚 Учёба</a><a href="pomodoro.html" class="nav-item">🍅 Таймер помодоро</a></div>
        </nav>
        <div class="content-area">
            <div class="study-header">
                <h1>📚 Трекер учёбы</h1>
                <button class="add-subject-btn" onclick="openSubjectModal()"><span>➕</span><span>Добавить предмет</span></button>
            </div>

            <div class="tab-navigation">
                <button class="tab-btn active" data-tab="subjects" onclick="switchTab('subjects')">📚 Предметы</button>
                <button class="tab-btn" data-tab="pending" onclick="switchTab('pending')">📋 Все задачи</button>
            </div>

            <!-- Сетка предметов -->
            <div id="subjectsContainer" class="subjects-grid"></div>

            <!-- Вкладка "Все задачи" -->
            <div id="pendingContainer" class="pending-full-list" style="display: none;">
                <div class="pending-full-header"><div class="pending-full-title">📋 Все невыполненные задачи</div></div>
                <div id="globalPendingTasksList"></div>
            </div>

            <!-- Раздел задач внутри предмета -->
            <div id="tasksSection" style="display:none;">
                <div class="tasks-header">
                    <div class="tasks-title" id="subjectTitle"></div>
                    <button class="inline-add-task-btn" onclick="openTaskModal()" title="Добавить задачу">+</button>
                </div>
                <div id="tasksList"></div>
                <button onclick="closeTasksSection()" style="margin-top:20px; padding:8px 16px; background:var(--color-bg); border:2px solid var(--color-border); border-radius:var(--radius-md); cursor:pointer; font-weight:600;">← Назад к предметам</button>
            </div>
        </div>
    </div>

    <!-- Плавающая кнопка добавления задачи (глобальная) -->
    <button class="fab-add-task" onclick="openGlobalTaskModal()">+</button>

    <!-- Модальное окно для добавления/редактирования предмета -->
    <div id="subjectModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="subjectModalTitle">➕ Добавить предмет</h3>
                <button class="close-modal" onclick="closeSubjectModal()">✖</button>
            </div>
            <div class="form-group">
                <label>Название предмета</label>
                <input type="text" id="subjectName" placeholder="Например: Математика">
            </div>
            <div class="form-group">
                <label>Иконка</label>
                <select id="subjectIcon">
                    <option value="📚">📚 Книги</option><option value="📐">📐 Математика</option><option value="🔬">🔬 Наука</option>
                    <option value="💻">💻 Программирование</option><option value="📝">📝 Письмо</option><option value="🎨">🎨 Искусство</option>
                    <option value="🌍">🌍 География</option><option value="📜">📜 История</option><option value="🔤">🔤 Язык</option>
                </select>
            </div>
            <button class="save-btn" onclick="saveSubject()">💾 Сохранить</button>
        </div>
    </div>

    <!-- Модальное окно для задачи (внутри предмета, без выбора предмета) -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="taskModalTitle">➕ Новая задача</h3>
                <button class="close-modal" onclick="closeTaskModal()">✖</button>
            </div>
            <div class="form-group">
                <label>Название задачи</label>
                <input type="text" id="taskTitle" placeholder="Например: Выучить главу 5">
            </div>
            <div class="form-group">
                <label>Дедлайн (необязательно)</label>
                <input type="date" id="taskDeadline">
            </div>
            <button class="save-btn" onclick="saveTask()">💾 Сохранить</button>
        </div>
    </div>

    <!-- Модальное окно для глобальной задачи (с выбором предмета) -->
    <div id="globalTaskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>➕ Новая задача</h3>
                <button class="close-modal" onclick="closeGlobalTaskModal()">✖</button>
            </div>
            <div class="form-group">
                <label>Название задачи</label>
                <input type="text" id="globalTaskTitle" placeholder="Например: Подготовиться к экзамену">
            </div>
            <div class="form-group">
                <label>Предмет</label>
                <select id="globalTaskSubjectId"></select>
            </div>
            <div class="form-group">
                <label>Дедлайн (необязательно)</label>
                <input type="date" id="globalTaskDeadline">
            </div>
            <button class="save-btn" onclick="saveGlobalTask()">💾 Сохранить</button>
        </div>
    </div>

    <script>
        let studyData = JSON.parse(localStorage.getItem('studyData')) || { subjects: [] };
        let currentSubjectId = null;
        let editingSubjectId = null;
        let editingTaskId = null;
        let currentTab = 'subjects';
        let firebaseReady = false, db = null, currentUser = null;

        const firebaseConfig = {
            apiKey: "AIzaSyARKWwV3cggOhda9g6cDNcEAGOpUN4O63I",
            authDomain: "lifedashbord.firebaseapp.com",
            projectId: "lifedashbord",
            storageBucket: "lifedashbord.appspot.com",
            messagingSenderId: "206574362724",
            appId: "1:206574362724:web:83887cae4dc87b41137f71"
        };

        // ---------- Инициализация ----------
        document.addEventListener('DOMContentLoaded', () => {
            initFirebase();
            renderAll();

            // Бургер-меню
            const burger = document.getElementById('burgerBtn');
            const nav = document.getElementById('navFrame');
            const overlay = document.getElementById('overlay');
            burger.addEventListener('click', () => { nav.classList.toggle('open'); overlay.classList.toggle('active'); });
            overlay.addEventListener('click', () => { nav.classList.remove('open'); overlay.classList.remove('active'); });
        });

        function initFirebase() {
            try {
                if (typeof firebase === 'undefined') return;
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                firebase.auth().onAuthStateChanged(user => {
                    if (user) {
                        currentUser = user;
                        firebaseReady = true;
                        loadStudyData();
                    }
                });
            } catch(e) {}
        }

        function loadStudyData() {
            if (!currentUser || !db) return;
            db.collection('users').doc(currentUser.uid).collection('study').doc('data').get().then(doc => {
                if (doc.exists && JSON.stringify(studyData) !== JSON.stringify(doc.data())) {
                    studyData = doc.data();
                    localStorage.setItem('studyData', JSON.stringify(studyData));
                    renderAll();
                }
            });
        }

        function saveStudyData() {
            localStorage.setItem('studyData', JSON.stringify(studyData));
            if (firebaseReady && currentUser && db) {
                db.collection('users').doc(currentUser.uid).collection('study').doc('data').set(studyData);
            }
        }

        function generateId() { return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9); }
        function escapeHtml(s) { if (!s) return ''; return s.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
        function formatDate(dateStr) { if (!dateStr) return ''; return new Date(dateStr).toLocaleDateString('ru-RU'); }

        // ---------- Прогресс предмета ----------
        function getSubjectProgress(subject) {
            if (!subject.tasks?.length) return 0;
            const completed = subject.tasks.filter(t => t.completed).length;
            return Math.round((completed / subject.tasks.length) * 100);
        }

        // ---------- Рендер списка предметов ----------
        function renderSubjects() {
            const container = document.getElementById('subjectsContainer');
            if (!studyData.subjects?.length) {
                container.innerHTML = '<div class="empty-state"><p>Пока нет предметов. Нажмите "Добавить предмет"!</p></div>';
                return;
            }
            container.innerHTML = '';
            studyData.subjects.forEach(subject => {
                const progress = getSubjectProgress(subject);
                const taskCount = subject.tasks?.length || 0;
                const card = document.createElement('div');
                card.className = 'subject-card';
                card.innerHTML = `
                    <button class="delete-subject-btn" onclick="deleteSubject('${subject.id}', event)">✖</button>
                    <div class="subject-icon">${subject.icon || '📚'}</div>
                    <div class="subject-title">${escapeHtml(subject.name)}</div>
                    <div class="subject-tasks">📌 ${taskCount} задач</div>
                    <div class="subject-progress"><div class="subject-progress-fill" style="width: ${progress}%"></div></div>
                `;
                card.onclick = e => { if (!e.target.classList.contains('delete-subject-btn')) openSubjectTasks(subject.id); };
                container.appendChild(card);
            });
        }

        // ---------- Рендер всех невыполненных задач (глобальная вкладка) ----------
        function renderGlobalPendingTasks() {
            const container = document.getElementById('globalPendingTasksList');
            let allTasks = [];
            studyData.subjects.forEach(subject => {
                (subject.tasks || []).forEach(task => {
                    if (!task.completed) {
                        allTasks.push({ ...task, subjectName: subject.name, subjectId: subject.id });
                    }
                });
            });
            // Сортировка по дедлайну (сначала ближайшие)
            allTasks.sort((a, b) => {
                if (a.deadline && !b.deadline) return -1;
                if (!a.deadline && b.deadline) return 1;
                if (a.deadline && b.deadline) return new Date(a.deadline) - new Date(b.deadline);
                return 0;
            });
            if (allTasks.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>✨ Все задачи выполнены! Отличная работа! 🎉</p></div>';
                return;
            }
            container.innerHTML = '';
            allTasks.forEach(task => {
                const item = document.createElement('div');
                item.className = 'task-item';
                const deadlineHtml = task.deadline ? `<span class="task-deadline">📅 ${formatDate(task.deadline)}</span>` : '';
                item.innerHTML = `
                    <input type="checkbox" class="task-checkbox" onchange="toggleGlobalTaskStatus('${task.id}', '${task.subjectId}', this.checked)">
                    <div class="task-content">
                        <div class="task-title">${escapeHtml(task.title)}</div>
                        <div class="task-meta">
                            <span class="task-subject">📘 ${escapeHtml(task.subjectName)}</span>
                            ${deadlineHtml}
                        </div>
                    </div>
                    <button class="delete-task-btn" onclick="event.stopPropagation(); deleteGlobalTask('${task.id}', '${task.subjectId}')">✖</button>
                `;
                item.onclick = (e) => {
                    if (!e.target.classList.contains('task-checkbox') && !e.target.classList.contains('delete-task-btn')) {
                        editGlobalTask(task.id, task.subjectId);
                    }
                };
                container.appendChild(item);
            });
        }

        // ---------- Работа с предметом (открытие задач, добавление, удаление) ----------
        function openSubjectTasks(subjectId) {
            currentSubjectId = subjectId;
            const subject = studyData.subjects.find(s => s.id === subjectId);
            if (!subject) return;
            document.getElementById('subjectTitle').innerHTML = `${subject.icon || '📚'} ${escapeHtml(subject.name)}`;
            document.getElementById('subjectsContainer').style.display = 'none';
            document.getElementById('pendingContainer').style.display = 'none';
            document.getElementById('tasksSection').style.display = 'block';
            renderTasks();
            document.querySelector('.fab-add-task').classList.add('hidden');
        }

        function closeTasksSection() {
            currentSubjectId = null;
            document.getElementById('tasksSection').style.display = 'none';
            if (currentTab === 'subjects') {
                document.getElementById('subjectsContainer').style.display = 'grid';
                document.getElementById('pendingContainer').style.display = 'none';
            } else {
                document.getElementById('subjectsContainer').style.display = 'none';
                document.getElementById('pendingContainer').style.display = 'block';
                renderGlobalPendingTasks();
            }
            renderSubjects();
            document.querySelector('.fab-add-task').classList.remove('hidden');
        }

        function renderTasks() {
            const container = document.getElementById('tasksList');
            const subject = studyData.subjects.find(s => s.id === currentSubjectId);
            if (!subject) return;
            const tasks = subject.tasks || [];
            if (tasks.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>Нет задач. Нажмите +, чтобы добавить!</p></div>';
                return;
            }
            // Сортировка: невыполненные сверху, выполненные снизу, по дедлайну
            const sorted = [...tasks].sort((a, b) => {
                if (a.completed !== b.completed) return a.completed ? 1 : -1;
                if (a.deadline && !b.deadline) return -1;
                if (!a.deadline && b.deadline) return 1;
                if (a.deadline && b.deadline) return new Date(a.deadline) - new Date(b.deadline);
                return 0;
            });
            container.innerHTML = '';
            sorted.forEach(task => {
                const item = document.createElement('div');
                item.className = 'task-item';
                const deadlineHtml = task.deadline ? `<span class="task-deadline">📅 ${formatDate(task.deadline)}</span>` : '';
                const completedClass = task.completed ? 'completed' : '';
                item.innerHTML = `
                    <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTaskStatus('${task.id}', this.checked)">
                    <div class="task-content">
                        <div class="task-title ${completedClass}">${escapeHtml(task.title)}</div>
                        <div class="task-meta">${deadlineHtml}</div>
                    </div>
                    <button class="delete-task-btn" onclick="event.stopPropagation(); deleteTask('${task.id}')">✖</button>
                `;
                item.onclick = (e) => {
                    if (!e.target.classList.contains('task-checkbox') && !e.target.classList.contains('delete-task-btn')) {
                        editTask(task.id);
                    }
                };
                container.appendChild(item);
            });
        }

        // ---------- Операции с задачами (внутри предмета) ----------
        window.openTaskModal = function() {
            if (!currentSubjectId) return;
            editingTaskId = null;
            document.getElementById('taskModalTitle').innerHTML = '➕ Новая задача';
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDeadline').value = '';
            document.getElementById('taskModal').classList.add('active');
        };
        window.closeTaskModal = () => document.getElementById('taskModal').classList.remove('active');
        window.saveTask = function() {
            const title = document.getElementById('taskTitle').value.trim();
            if (!title) return;
            const subject = studyData.subjects.find(s => s.id === currentSubjectId);
            if (!subject) return;
            if (!subject.tasks) subject.tasks = [];
            const deadline = document.getElementById('taskDeadline').value;
            if (editingTaskId) {
                const task = subject.tasks.find(t => t.id === editingTaskId);
                if (task) {
                    task.title = title;
                    task.deadline = deadline || null;
                }
            } else {
                subject.tasks.push({
                    id: generateId(),
                    title: title,
                    deadline: deadline || null,
                    completed: false,
                    createdAt: new Date().toISOString()
                });
            }
            saveStudyData();
            closeTaskModal();
            renderTasks();
            renderSubjects(); // обновить прогресс
            editingTaskId = null;
        };
        window.toggleTaskStatus = function(taskId, completed) {
            const subject = studyData.subjects.find(s => s.id === currentSubjectId);
            if (!subject) return;
            const task = subject.tasks.find(t => t.id === taskId);
            if (task) task.completed = completed;
            saveStudyData();
            renderTasks();
            renderSubjects();
        };
        window.editTask = function(taskId) {
            const subject = studyData.subjects.find(s => s.id === currentSubjectId);
            if (!subject) return;
            const task = subject.tasks.find(t => t.id === taskId);
            if (!task) return;
            editingTaskId = taskId;
            document.getElementById('taskModalTitle').innerHTML = '✏️ Редактировать задачу';
            document.getElementById('taskTitle').value = task.title;
            document.getElementById('taskDeadline').value = task.deadline || '';
            document.getElementById('taskModal').classList.add('active');
        };
        window.deleteTask = function(taskId) {
            if (!confirm('Удалить задачу?')) return;
            const subject = studyData.subjects.find(s => s.id === currentSubjectId);
            if (subject && subject.tasks) {
                subject.tasks = subject.tasks.filter(t => t.id !== taskId);
                saveStudyData();
                renderTasks();
                renderSubjects();
            }
        };

        // ---------- Глобальные задачи (с выбором предмета) ----------
        function populateSubjectSelect() {
            const select = document.getElementById('globalTaskSubjectId');
            select.innerHTML = '<option value="">-- Выберите предмет --</option>';
            studyData.subjects.forEach(subj => {
                select.innerHTML += `<option value="${subj.id}">${escapeHtml(subj.name)}</option>`;
            });
        }

        window.openGlobalTaskModal = function() {
            populateSubjectSelect();
            document.getElementById('globalTaskTitle').value = '';
            document.getElementById('globalTaskDeadline').value = '';
            document.getElementById('globalTaskModal').classList.add('active');
            window._editingGlobalTask = null;
        };
        window.closeGlobalTaskModal = () => document.getElementById('globalTaskModal').classList.remove('active');
        window.saveGlobalTask = function() {
            const subjectId = document.getElementById('globalTaskSubjectId').value;
            const title = document.getElementById('globalTaskTitle').value.trim();
            if (!subjectId || !title) { alert('Выберите предмет и введите название задачи'); return; }
            const subject = studyData.subjects.find(s => s.id === subjectId);
            if (!subject) return;
            if (!subject.tasks) subject.tasks = [];
            const deadline = document.getElementById('globalTaskDeadline').value;
            if (window._editingGlobalTask) {
                const oldSubject = studyData.subjects.find(s => s.id === window._editingGlobalTask.subjectId);
                if (oldSubject && oldSubject.tasks) {
                    const task = oldSubject.tasks.find(t => t.id === window._editingGlobalTask.taskId);
                    if (task) {
                        if (oldSubject.id !== subjectId) {
                            oldSubject.tasks = oldSubject.tasks.filter(t => t.id !== window._editingGlobalTask.taskId);
                            subject.tasks.push(task);
                        }
                        task.title = title;
                        task.deadline = deadline || null;
                    }
                }
            } else {
                subject.tasks.push({
                    id: generateId(),
                    title: title,
                    deadline: deadline || null,
                    completed: false,
                    createdAt: new Date().toISOString()
                });
            }
            saveStudyData();
            closeGlobalTaskModal();
            renderAll();
            if (currentSubjectId === subjectId) renderTasks();
        };
        window.toggleGlobalTaskStatus = function(taskId, subjectId, completed) {
            const subject = studyData.subjects.find(s => s.id === subjectId);
            if (!subject) return;
            const task = subject.tasks.find(t => t.id === taskId);
            if (task) task.completed = completed;
            saveStudyData();
            renderAll();
            if (currentSubjectId === subjectId) renderTasks();
        };
        window.editGlobalTask = function(taskId, subjectId) {
            const subject = studyData.subjects.find(s => s.id === subjectId);
            if (!subject) return;
            const task = subject.tasks.find(t => t.id === taskId);
            if (!task) return;
            populateSubjectSelect();
            document.getElementById('globalTaskSubjectId').value = subjectId;
            document.getElementById('globalTaskTitle').value = task.title;
            document.getElementById('globalTaskDeadline').value = task.deadline || '';
            window._editingGlobalTask = { taskId, subjectId };
            document.getElementById('globalTaskModal').classList.add('active');
        };
        window.deleteGlobalTask = function(taskId, subjectId) {
            if (!confirm('Удалить задачу?')) return;
            const subject = studyData.subjects.find(s => s.id === subjectId);
            if (subject && subject.tasks) {
                subject.tasks = subject.tasks.filter(t => t.id !== taskId);
                saveStudyData();
                renderAll();
                if (currentSubjectId === subjectId) renderTasks();
            }
        };

        // ---------- Операции с предметами ----------
        window.openSubjectModal = function() {
            editingSubjectId = null;
            document.getElementById('subjectModalTitle').innerHTML = '➕ Добавить предмет';
            document.getElementById('subjectName').value = '';
            document.getElementById('subjectIcon').value = '📚';
            document.getElementById('subjectModal').classList.add('active');
        };
        window.closeSubjectModal = () => document.getElementById('subjectModal').classList.remove('active');
        window.saveSubject = function() {
            const name = document.getElementById('subjectName').value.trim();
            if (!name) { alert('Введите название предмета'); return; }
            const icon = document.getElementById('subjectIcon').value;
            if (editingSubjectId) {
                const subj = studyData.subjects.find(s => s.id === editingSubjectId);
                if (subj) { subj.name = name; subj.icon = icon; }
            } else {
                studyData.subjects.push({ id: generateId(), name, icon, tasks: [] });
            }
            saveStudyData();
            closeSubjectModal();
            renderAll();
        };
        window.deleteSubject = function(subjectId, event) {
            event.stopPropagation();
            if (!confirm('Удалить предмет и все его задачи?')) return;
            studyData.subjects = studyData.subjects.filter(s => s.id !== subjectId);
            saveStudyData();
            if (currentSubjectId === subjectId) closeTasksSection();
            renderAll();
        };

        // ---------- Переключение вкладок ----------
        window.switchTab = function(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
            if (tab === 'subjects') {
                document.getElementById('subjectsContainer').style.display = 'grid';
                document.getElementById('pendingContainer').style.display = 'none';
                renderSubjects();
            } else {
                document.getElementById('subjectsContainer').style.display = 'none';
                document.getElementById('pendingContainer').style.display = 'block';
                renderGlobalPendingTasks();
            }
            if (document.getElementById('tasksSection').style.display === 'block') closeTasksSection();
        };

        function renderAll() {
            if (currentTab === 'subjects') {
                document.getElementById('subjectsContainer').style.display = 'grid';
                document.getElementById('pendingContainer').style.display = 'none';
                renderSubjects();
            } else {
                document.getElementById('subjectsContainer').style.display = 'none';
                document.getElementById('pendingContainer').style.display = 'block';
                renderGlobalPendingTasks();
            }
            if (currentSubjectId) renderTasks();
        }
    </script>
</body>
</html>
