<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LifeDashboard | План недели</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --color-primary: #93ABDB;
            --color-primary-dark: #768FC2;
            --color-primary-light: #C2D4F5;
            --color-secondary: #FAF4CD;
            --color-secondary-dark: #E6DFB3;
            --color-secondary-light: #FFF9E6;
            --color-accent: #5B6F9E;
            --color-text: #3D4A66;
            --color-text-light: #6B7C9E;
            --color-text-muted: #A5B3CC;
            --color-bg: #FDFBF0;
            --color-bg-alt: #FFFFFF;
            --color-border: #FAF4CD;
            --color-border-light: #FFF4E0;
            --color-success: #6BCB77;
            --color-warning: #FFD93D;
            --color-error: #E15554;
            --shadow-sm: 0 2px 8px rgba(91, 111, 158, 0.05);
            --shadow-md: 0 4px 15px rgba(91, 111, 158, 0.08);
            --shadow-lg: 0 10px 30px rgba(91, 111, 158, 0.12);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            
            /* Цвета категорий (пастельные, спокойные) */
            --cat-work: #B8CCE4;
            --cat-study: #C8DFCF;
            --cat-hobby: #F2E3D4;
            --cat-rest: #DCCFEC;
            --cat-family: #F9E8D1;
            --cat-sport: #CBE2DA;
            --cat-selfdev: #DBDDF0;
            --cat-other: #E6E1D7;
        }

        body { font-family: 'Inter', sans-serif; background: var(--color-bg); color: var(--color-text); line-height: 1.5; }

        /* ---------- НАВИГАЦИЯ (десктоп + бургер) ---------- */
        .app-layout { display: flex; min-height: 100vh; position: relative; overflow-x: hidden; }
        .burger-btn { display: none; position: fixed; top: 16px; left: 16px; z-index: 1001; width: 44px; height: 44px; background: var(--color-primary); border: none; border-radius: 50%; color: white; font-size: 1.6rem; cursor: pointer; box-shadow: var(--shadow-md); align-items: center; justify-content: center; }
        .nav-frame {
            width: 18%; min-width: 220px; background: var(--color-primary); padding: 24px 16px; border-right: 2px solid var(--color-primary-dark);
            position: fixed; height: 100vh; overflow-y: auto; z-index: 100; box-shadow: 4px 0 20px rgba(62, 92, 102, 0.15);
            transition: transform 0.3s ease;
        }
        .logo { margin-bottom: 16px; padding: 12px; border-bottom: 2px solid #ffffff; text-align: center; background: rgba(255, 255, 255, 0.1); border-radius: 12px; }
        .logo h1 { color: #ffffff; font-size: 1.2rem; font-weight: 700; }
        .logo p { color: var(--color-bg); font-size: 0.75rem; opacity: 0.9; }
        .nav-section { margin-bottom: 20px; }
        .nav-title { color: rgba(255,255,255,0.7); font-size: 0.85em; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; padding-left: 8px; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; color: whitesmoke; text-decoration: none; border-radius: var(--radius-md); margin-bottom: 4px; transition: var(--transition); font-weight: 600; }
        .nav-item:hover { background: var(--color-primary-dark); transform: translateX(4px); }
        .nav-item.active { background: var(--color-accent); font-weight: 700; }
        .content-area { flex: 1; margin-left: 18%; padding: 24px 32px; max-width: 1600px; width: 100%; }

        /* ---------- КАРТОЧКА ---------- */
        .card {
            background: var(--color-bg-alt);
            border-radius: var(--radius-lg);
            padding: 24px;
            border: 2px solid var(--color-border);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }
        .card h2 {
            color: var(--color-primary-dark);
            font-weight: 700;
            font-size: 1.4em;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--color-border);
        }

        /* ---------- НАВИГАЦИЯ ПО НЕДЕЛЯМ ---------- */
        .week-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
            flex-wrap: wrap;
        }
        .week-nav button {
            background: var(--color-secondary);
            border: none;
            padding: 8px 16px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            color: var(--color-text);
            transition: var(--transition);
        }
        .week-nav button:hover { background: var(--color-primary); color: white; transform: translateY(-2px); }
        .week-interval {
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
            color: var(--color-text);
            font-size: 1.1em;
            background: var(--color-secondary-light);
            padding: 8px;
            border-radius: var(--radius-lg);
        }

        /* ---------- ТАБЛИЦА НЕДЕЛИ (горизонтальный скролл, закреплённый первый столбец) ---------- */
        .week-table-container {
            overflow-x: auto;
            overflow-y: visible;
            width: 100%;
            border: 1px solid var(--color-border-light);
            border-radius: var(--radius-lg);
            background: white;
            max-width: 100%;
        }
        .week-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }
        .week-table th, .week-table td {
            border: 1px solid var(--color-border-light);
            padding: 12px 8px;
            vertical-align: top;
            background: var(--color-bg-alt);
            word-break: break-word;
        }
        .week-table th {
            background: var(--color-primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .week-table th:hover { background: var(--color-primary-dark); }
        /* Закреплённый первый столбец */
        .week-table th:first-child,
        .week-table td:first-child {
            position: sticky;
            left: 0;
            background: var(--color-primary);
            color: white;
            z-index: 10;
            border-right: 2px solid var(--color-border);
        }
        .week-table td:first-child {
            background: var(--color-primary-light);
            color: var(--color-text);
            font-weight: 600;
        }
        .week-table tr:hover td:first-child {
            background: var(--color-primary-light);
        }

        /* ---------- ЗАДАЧИ В ЯЧЕЙКЕ ---------- */
        .task-item {
            display: block;
            margin-bottom: 8px;
            cursor: pointer;
            transition: var(--transition);
            border-radius: var(--radius-md);
            overflow: hidden;
            position: relative;
            border: 1px solid var(--color-border);
        }
        .task-item:hover { transform: translateX(2px); box-shadow: var(--shadow-sm); }
        .task-item.important-task {
            border-left: 4px solid var(--color-warning);
            background: linear-gradient(90deg, rgba(255, 217, 61, 0.15), var(--color-bg-alt));
        }
        /* Цвета категорий для задачи – фон блока */
        .task-block {
            display: flex;
            flex-direction: column;
            padding: 8px 10px;
            gap: 6px;
        }
        .task-block.category-work { background: var(--cat-work); }
        .task-block.category-study { background: var(--cat-study); }
        .task-block.category-hobby { background: var(--cat-hobby); }
        .task-block.category-rest { background: var(--cat-rest); }
        .task-block.category-family { background: var(--cat-family); }
        .task-block.category-sport { background: var(--cat-sport); }
        .task-block.category-selfdev { background: var(--cat-selfdev); }
        .task-block.category-other { background: var(--cat-other); }
        
        .task-header {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .task-checkbox-week {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--color-accent);
        }
        .task-time-range {
            font-size: 0.7em;
            font-weight: 600;
            opacity: 0.8;
            background: rgba(0,0,0,0.1);
            padding: 2px 6px;
            border-radius: 12px;
        }
        .task-text {
            font-size: 0.9em;
            font-weight: 500;
            word-break: break-word;
            line-height: 1.3;
        }
        .task-text.completed {
            text-decoration: line-through;
            opacity: 0.6;
        }
        .task-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }
        .task-category-badge {
            font-size: 0.7em;
            background: rgba(0,0,0,0.05);
            padding: 2px 6px;
            border-radius: 12px;
        }
        .important-badge {
            font-size: 0.7em;
            padding: 2px 6px;
            border-radius: 12px;
            background: var(--color-warning);
            color: #000;
            font-weight: 600;
        }
        .delete-task-btn-week {
            background: rgba(0,0,0,0.2);
            border: none;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.7em;
            color: var(--color-text);
            transition: var(--transition);
        }
        .delete-task-btn-week:hover { background: rgba(0,0,0,0.4); }
        .empty-state {
            color: var(--color-text-light);
            background: var(--color-primary-light);
            border: 2px dashed var(--color-border);
            padding: 12px;
            border-radius: var(--radius-lg);
            text-align: center;
            font-size: 0.8em;
        }

        /* ---------- МОДАЛЬНЫЕ ОКНА ---------- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(62, 92, 102, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: var(--radius-xl);
            padding: 24px;
            width: 100%;
            max-width: 500px;
            border: 2px solid var(--color-border);
            box-shadow: var(--shadow-lg);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--color-border);
        }
        .modal-header h3 { color: var(--color-primary); font-weight: 700; margin: 0; }
        .close-modal { background: none; border: none; font-size: 1.6em; cursor: pointer; color: var(--color-primary); }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: var(--color-primary-dark); }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; background: var(--color-bg); border: 2px solid var(--color-border); border-radius: var(--radius-md); }
        .time-row { display: flex; gap: 10px; align-items: center; }
        .time-row input { flex: 1; }
        .time-separator { font-weight: bold; color: var(--color-text); }
        .save-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-nav-light));
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .save-btn:hover { transform: translateY(-2px); background: var(--color-primary-dark); }

        /* ---------- АДАПТИВНОСТЬ (МОБИЛЬНАЯ) ---------- */
        @media (max-width: 1024px) {
            .app-layout { flex-direction: column; }
            .nav-frame {
                width: 100%;
                height: auto;
                position: relative;
                flex-direction: row;
                flex-wrap: wrap;
                padding: 12px 16px;
                border-right: none;
                border-bottom: 2px solid var(--color-primary);
            }
            .content-area { margin-left: 0; padding: 20px; }
        }
        @media (max-width: 768px) {
            .burger-btn { display: flex; }
            .nav-frame {
                transform: translateX(-100%);
                width: 80%;
                max-width: 280px;
                position: fixed;
                top: 0;
                left: 0;
                flex-direction: column;
                border-bottom: none;
                border-right: 2px solid var(--color-primary-dark);
            }
            .nav-frame.open { transform: translateX(0); }
            .content-area { margin-left: 0; padding: 60px 16px 16px; }
            .overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.4);
                z-index: 99;
            }
            .overlay.active { display: block; }
            .week-table th, .week-table td { padding: 8px 4px; font-size: 0.8em; }
            .task-text { font-size: 0.85em; }
            .task-block { padding: 6px 8px; }
            .task-checkbox-week { width: 20px; height: 20px; }
            .delete-task-btn-week { padding: 4px 6px; }
            .week-nav button { padding: 6px 12px; font-size: 0.8em; }
        }
        .overlay { display: none; }
    </style>
</head>
<body>
    <button class="burger-btn" id="burgerBtn">☰</button>
    <div class="overlay" id="overlay"></div>
    <div class="app-layout">
        <nav class="nav-frame" id="navFrame">
            <div class="logo"><h1>📅 LifeDashboard</h1><p>Полный набор для продуктивности</p></div>
            <div class="nav-section"><div class="nav-title">ГЛАВНОЕ</div><a href="index.html" class="nav-item">🏠 Главная</a><a href="day.html" class="nav-item">📆 План на день</a></div>
            <div class="nav-section"><div class="nav-title">ПЛАНИРОВАНИЕ</div><a href="week.html" class="nav-item active">📋 Неделя</a><a href="month.html" class="nav-item">🗓️ Месяц</a><a href="year.html" class="nav-item">🎯 Год</a></div>
            <div class="nav-section"><div class="nav-title">ТРЕКЕРЫ</div><a href="habits.html" class="nav-item">🔥 Привычки</a><a href="finance.html" class="nav-item">💰 Финансы</a><a href="media.html" class="nav-item">📚🎬 Книги и фильмы</a><a href="study.html" class="nav-item">📚 Учёба</a><a href="pomodoro.html" class="nav-item">🍅 Таймер помодоро</a></div>
        </nav>
        <div class="content-area">
            <div class="card">
                <h2>📋 План недели</h2>
                <div class="week-nav">
                    <button onclick="prevWeek()">◀ Предыдущая</button>
                    <button onclick="goToCurrentWeek()">Текущая</button>
                    <button onclick="nextWeek()">Следующая ▶</button>
                </div>
                <div class="week-interval" id="weekInterval"></div>
                <div class="week-table-container">
                    <table class="week-table" id="weekTable">
                        <thead id="weekTableHead"></thead>
                        <tbody id="weekTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно добавления/редактирования задачи -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="taskModalTitle">➕ Новая задача</h3>
                <button class="close-modal" onclick="closeTaskModal()">✖</button>
            </div>
            <div class="form-group"><label>Название</label><input type="text" id="taskTitle" placeholder="Что нужно сделать?"></div>
            <div class="form-group"><label>Время (необязательно)</label><div class="time-row"><input type="time" id="taskStartTime"><span class="time-separator">—</span><input type="time" id="taskEndTime"></div></div>
            <div class="form-group"><label>Категория</label><select id="taskCategory"></select></div>
            <div class="form-group"><label><input type="checkbox" id="taskImportant" style="width:18px;height:18px; vertical-align:middle;"> ⭐ Важная задача</label></div>
            <div class="form-group"><label>Заметки</label><textarea id="taskNotes" rows="2"></textarea></div>
            <button class="save-btn" onclick="saveTask()">💾 Сохранить</button>
        </div>
    </div>

    <script>
        // ----------------------------- Данные -----------------------------
        let allTasks = JSON.parse(localStorage.getItem('allTasks')) || {};
        let taskCategories = JSON.parse(localStorage.getItem('taskCategories')) || [
            { id: 'work', name: 'Работа', color: '#B8CCE4' },
            { id: 'study', name: 'Учёба', color: '#C8DFCF' },
            { id: 'hobby', name: 'Хобби', color: '#F2E3D4' },
            { id: 'rest', name: 'Отдых', color: '#DCCFEC' },
            { id: 'family', name: 'Семья', color: '#F9E8D1' },
            { id: 'sport', name: 'Спорт', color: '#CBE2DA' },
            { id: 'selfdev', name: 'Саморазвитие', color: '#DBDDF0' },
            { id: 'other', name: 'Без категории', color: '#E6E1D7' }
        ];

        let currentWeekOffset = 0;
        let currentEditTask = { dateKey: null, taskId: null };
        let firebaseReady = false, db = null, currentUser = null;
        const firebaseConfig = {
            apiKey: "AIzaSyARKWwV3cggOhda9g6cDNcEAGOpUN4O63I",
            authDomain: "lifedashbord.firebaseapp.com",
            projectId: "lifedashbord",
            storageBucket: "lifedashbord.appspot.com",
            messagingSenderId: "206574362724",
            appId: "1:206574362724:web:83887cae4dc87b41137f71"
        };

        const dayNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

        // ----------------------------- Инициализация -----------------------------
        document.addEventListener('DOMContentLoaded', () => {
            initFirebase();
            renderWeekPlanner();

            const burger = document.getElementById('burgerBtn');
            const nav = document.getElementById('navFrame');
            const overlay = document.getElementById('overlay');
            burger.addEventListener('click', () => { nav.classList.toggle('open'); overlay.classList.toggle('active'); });
            overlay.addEventListener('click', () => { nav.classList.remove('open'); overlay.classList.remove('active'); });
        });

        // ----------------------------- Firebase -----------------------------
        function initFirebase() {
            let timeout = setTimeout(() => { firebaseReady = false; }, 5000);
            try {
                if (typeof firebase === 'undefined') { clearTimeout(timeout); return; }
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                firebase.auth().onAuthStateChanged(user => {
                    clearTimeout(timeout);
                    if (user) {
                        currentUser = user;
                        firebaseReady = true;
                        loadUserData();
                    } else { firebaseReady = false; }
                });
            } catch(e) { clearTimeout(timeout); firebaseReady = false; }
        }

        function loadUserData() {
            if (!currentUser || !db) return;
            db.collection('users').doc(currentUser.uid).collection('tasks').get().then(snap => {
                let loaded = {};
                snap.forEach(doc => { loaded[doc.id] = doc.data(); });
                if (JSON.stringify(allTasks) !== JSON.stringify(loaded)) {
                    allTasks = loaded;
                    localStorage.setItem('allTasks', JSON.stringify(allTasks));
                    renderWeekPlanner();
                }
            });
            db.collection('users').doc(currentUser.uid).collection('settings').doc('taskCategories').get().then(doc => {
                if (doc.exists && doc.data().categories) {
                    taskCategories = doc.data().categories;
                    localStorage.setItem('taskCategories', JSON.stringify(taskCategories));
                    renderWeekPlanner();
                }
            });
        }

        function saveAllTasks() {
            localStorage.setItem('allTasks', JSON.stringify(allTasks));
            if (firebaseReady && currentUser && db) {
                Object.keys(allTasks).forEach(dateKey => {
                    db.collection('users').doc(currentUser.uid).collection('tasks').doc(dateKey).set(allTasks[dateKey]);
                });
            }
        }

        function saveCategories() {
            localStorage.setItem('taskCategories', JSON.stringify(taskCategories));
            if (firebaseReady && currentUser && db) {
                db.collection('users').doc(currentUser.uid).collection('settings').doc('taskCategories').set({ categories: taskCategories });
            }
            populateCategorySelect();
            renderWeekPlanner();
        }

        // ----------------------------- Работа с датами -----------------------------
        function getDateKey(date) { return date.toISOString().split('T')[0]; }
        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
        function formatTimeRange(start, end) { if (!start && !end) return ''; if (start && !end) return start; if (!start && end) return '— ' + end; return start + ' — ' + end; }
        function formatDate(date) { return date.getDate() + '.' + (date.getMonth() + 1); }
        function getStartOfWeek(baseDate, offset) {
            let d = new Date(baseDate);
            let day = d.getDay();
            let diff = day === 0 ? -6 : 1 - day;
            d.setDate(d.getDate() + diff + (offset * 7));
            return d;
        }
        function generateTaskId() { return 'task_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9); }

        // ----------------------------- Отображение недели -----------------------------
        function renderWeekPlanner() {
            let today = new Date();
            let startOfWeek = getStartOfWeek(today, currentWeekOffset);
            let endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);
            document.getElementById('weekInterval').innerHTML = `📅 ${formatDate(startOfWeek)} — ${formatDate(endOfWeek)} (${startOfWeek.getFullYear()})`;

            // Заголовок таблицы
            let headerHtml = '<tr><th>Предметы</th>';
            for (let i = 0; i < 7; i++) {
                let curr = new Date(startOfWeek);
                curr.setDate(startOfWeek.getDate() + i);
                let dateKey = getDateKey(curr);
                headerHtml += `<th onclick="openAddTaskModal('${dateKey}')">${dayNames[i]}<br><span style="font-size:0.8em;">${formatDate(curr)}</span></th>`;
            }
            headerHtml += '</tr>';
            document.getElementById('weekTableHead').innerHTML = headerHtml;

            // Тело таблицы – только одна строка, чтобы показать все задачи каждого дня? Нет, у нас каждая задача выводится в своей ячейке. На самом деле таблица должна иметь одну строку, где в каждой ячейке список задач. 
            // Но чтобы не усложнять, сделаем одну строку (body), а в каждой ячейке – список задач.
            let bodyHtml = '<tr>';
            for (let i = 0; i < 7; i++) {
                let curr = new Date(startOfWeek);
                curr.setDate(startOfWeek.getDate() + i);
                let key = getDateKey(curr);
                let tasks = allTasks[key]?.tasks || [];
                tasks.sort((a,b) => {
                    if (a.important && !b.important) return -1;
                    if (!a.important && b.important) return 1;
                    if (a.completed && !b.completed) return 1;
                    if (!a.completed && b.completed) return -1;
                    return (a.startTime || '00:00').localeCompare(b.startTime || '00:00');
                });
                let tasksHtml = '';
                tasks.forEach(task => {
                    let catId = task.category || 'other';
                    let cat = taskCategories.find(c => c.id === catId) || { id: 'other', name: 'Без категории', color: '#E6E1D7' };
                    let timeRange = formatTimeRange(task.startTime, task.endTime);
                    let importantClass = task.important ? 'important-task' : '';
                    let completedClass = task.completed ? 'completed' : '';
                    let categoryClass = catId === 'other' ? 'category-other' : `category-${catId}`;
                    tasksHtml += `
                        <div class="task-item ${importantClass}" onclick="openEditTaskModal('${key}', '${task.id}')">
                            <div class="task-block ${categoryClass}">
                                <div class="task-header">
                                    <input type="checkbox" class="task-checkbox-week" ${task.completed ? 'checked' : ''} onclick="event.stopPropagation(); toggleTaskComplete('${key}', '${task.id}', this.checked)">
                                    ${timeRange ? `<div class="task-time-range">⏰ ${timeRange}</div>` : ''}
                                </div>
                                <div class="task-text ${completedClass}">${escapeHtml(task.text)}</div>
                                <div class="task-footer">
                                    <span class="task-category-badge">${cat.name}</span>
                                    ${task.important ? '<span class="important-badge">🔥 Важная</span>' : ''}
                                    <button class="delete-task-btn-week" onclick="event.stopPropagation(); deleteTask('${key}', '${task.id}')">✖</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                if (tasksHtml === '') tasksHtml = '<div class="empty-state">—</div>';
                bodyHtml += `<td style="vertical-align:top;">${tasksHtml}</td>`;
            }
            bodyHtml += '</tr>';
            document.getElementById('weekTableBody').innerHTML = bodyHtml;
        }

        // ----------------------------- Открытие модалки  -----------------------------
        function populateCategorySelect() {
            let select = document.getElementById('taskCategory');
            select.innerHTML = '';
            taskCategories.forEach(cat => {
                let opt = document.createElement('option');
                opt.value = cat.id;
                opt.textContent = cat.name;
                select.appendChild(opt);
            });
        }

        window.openAddTaskModal = function(dateKey) {
            currentEditTask = { dateKey, taskId: null };
            document.getElementById('taskModalTitle').innerHTML = '➕ Новая задача';
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskStartTime').value = '';
            document.getElementById('taskEndTime').value = '';
            document.getElementById('taskImportant').checked = false;
            document.getElementById('taskNotes').value = '';
            populateCategorySelect();
            document.getElementById('taskModal').classList.add('active');
        };

        window.openEditTaskModal = function(dateKey, taskId) {
            let tasks = allTasks[dateKey]?.tasks || [];
            let task = tasks.find(t => t.id === taskId);
            if (!task) return;
            currentEditTask = { dateKey, taskId };
            document.getElementById('taskModalTitle').innerHTML = '✏️ Редактировать задачу';
            document.getElementById('taskTitle').value = task.text;
            document.getElementById('taskStartTime').value = task.startTime || '';
            document.getElementById('taskEndTime').value = task.endTime || '';
            document.getElementById('taskImportant').checked = task.important || false;
            document.getElementById('taskNotes').value = task.notes || '';
            populateCategorySelect();
            document.getElementById('taskCategory').value = task.category || 'work';
            document.getElementById('taskModal').classList.add('active');
        };

        window.closeTaskModal = function() { document.getElementById('taskModal').classList.remove('active'); };

        window.saveTask = function() {
            let title = document.getElementById('taskTitle').value.trim();
            if (!title) { alert('Введите название задачи'); return; }
            let startTime = document.getElementById('taskStartTime').value;
            let endTime = document.getElementById('taskEndTime').value;
            let category = document.getElementById('taskCategory').value;
            let important = document.getElementById('taskImportant').checked;
            let notes = document.getElementById('taskNotes').value.trim();

            if (!allTasks[currentEditTask.dateKey]) allTasks[currentEditTask.dateKey] = { tasks: [] };
            let taskData = {
                text: title,
                startTime: startTime || null,
                endTime: endTime || null,
                category: category,
                important: important,
                completed: false,
                notes: notes,
                id: currentEditTask.taskId || generateTaskId()
            };
            if (currentEditTask.taskId) {
                let idx = allTasks[currentEditTask.dateKey].tasks.findIndex(t => t.id === currentEditTask.taskId);
                if (idx !== -1) allTasks[currentEditTask.dateKey].tasks[idx] = taskData;
                else allTasks[currentEditTask.dateKey].tasks.push(taskData);
            } else {
                allTasks[currentEditTask.dateKey].tasks.push(taskData);
            }
            saveAllTasks();
            closeTaskModal();
            renderWeekPlanner();
        };

        window.toggleTaskComplete = function(dateKey, taskId, checked) {
            let tasks = allTasks[dateKey]?.tasks || [];
            let task = tasks.find(t => t.id === taskId);
            if (task) {
                task.completed = checked;
                saveAllTasks();
                renderWeekPlanner();
            }
        };

        window.deleteTask = function(dateKey, taskId) {
            let tasks = allTasks[dateKey]?.tasks || [];
            let idx = tasks.findIndex(t => t.id === taskId);
            if (idx !== -1) {
                allTasks[dateKey].tasks.splice(idx, 1);
                if (allTasks[dateKey].tasks.length === 0) delete allTasks[dateKey];
                saveAllTasks();
                renderWeekPlanner();
            }
        };

        window.prevWeek = function() { currentWeekOffset--; renderWeekPlanner(); };
        window.nextWeek = function() { currentWeekOffset++; renderWeekPlanner(); };
        window.goToCurrentWeek = function() { currentWeekOffset = 0; renderWeekPlanner(); };
    </script>
</body>
</html>
